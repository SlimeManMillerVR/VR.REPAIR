
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VRNEEQ</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: white;

    background:
        radial-gradient(ellipse at 50% 42%,
            rgba(180, 180, 180, 0.24) 0%,
            transparent 48%),
        radial-gradient(circle at 0% 0%,
            rgba(255, 255, 255, 0.12),
            transparent 35%),
        radial-gradient(circle at 100% 100%,
            rgba(0, 0, 0, 0.5),
            transparent 45%),
        linear-gradient(135deg,
            #55585c,
            #383b3f 45%,
            #202226);
}

/* Grid background */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;

    background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);

    background-size: 35px 35px;

    mask-image: linear-gradient(
        to bottom,
        transparent,
        black 20%,
        black 80%,
        transparent
    );
}

/* Soft border lighting */
body::after {
    content: "";
    position: fixed;
    inset: 12px;
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 14px;
    pointer-events: none;
    box-shadow:
        inset 0 0 35px rgba(255,255,255,0.025),
        0 0 30px rgba(0,0,0,0.15);
}

h1 {
    position: absolute;
    top: 28px;
    left: 50%;
    transform: translateX(-50%);
    margin: 0;

    font-size: 36px;
    font-weight: 800;
    letter-spacing: 5px;

    color: #f5f5f5;
    text-shadow:
        0 2px 3px rgba(0,0,0,0.4),
        0 0 18px rgba(255,255,255,0.15);
}

.buttons {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
}

button {
    width: 220px;
    height: 60px;

    background: linear-gradient(
        145deg,
        #ffffff,
        #e7e7e7
    );

    color: #242424;
    border: 1px solid rgba(255,255,255,0.8);
    border-radius: 8px;

    font-size: 22px;
    font-weight: bold;
    letter-spacing: 1px;

    cursor: pointer;

    box-shadow:
        0 5px 0 rgba(0,0,0,0.18),
        0 10px 25px rgba(0,0,0,0.2);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
}

button:hover {
    background: #f4f4f4;
    transform: translateY(-3px);
    box-shadow:
        0 8px 0 rgba(0,0,0,0.15),
        0 14px 30px rgba(0,0,0,0.3);
}

button:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<h1>VRNEEQ</h1>

<div class="buttons">
    <button onclick="window.location.href='yeeps().html'">
        YEEPS( )
    </button>

    <button>
        C( )
    </button>
</div>

</body>
</html>
